name: Build Undirect IPA

# Releases happen two ways:
#  - Change the VERSION file on main (e.g. to 3.23): this builds the app,
#    then creates the v3.23 tag and the release with the IPA attached.
#    A VERSION that's already been released just builds, no new release.
#  - Push a v* tag yourself, as before.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*"

# Never run two release builds for the same ref at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ad-block regression tests
        run: python3 Tools/adblock-test/run.py

      - name: Fingerprint shield test
        run: if command -v node >/dev/null; then node Tools/fingerprint-test/run.js; else echo "node not available, skipped"; fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Diagnose Xcode environment
        run: |
          { ls /Applications | grep -i xcode || true
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list runtimes || true
          } 2>&1 | tee diag.log

      - name: Download prebuilt Tor (iCepa/Tor.framework)
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          curl -fsSL -o tor.zip "https://github.com/iCepa/Tor.framework/releases/download/${TOR_VERSION}/tor-nolzma.xcframework.zip"
          unzip -q tor.zip -d Frameworks
          rm tor.zip
          ls Frameworks
        env:
          TOR_VERSION: v409.12.1

      - name: Work out the version and whether to release
        id: version
        run: |
          set -euo pipefail
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -f VERSION ]]; then
            VERSION="$(tr -d ' \t\r\n' < VERSION)"
            VERSION="${VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::VERSION must look like 3.23 (got '$VERSION')"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
              echo "::warning::v${VERSION} is already released; building without a new release. Bump VERSION to release."
            else
              RELEASE=true
            fi
          else
            VERSION="0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION}, release: ${RELEASE}"

      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD="${GITHUB_RUN_NUMBER}"
          echo "Stamping version $VERSION ($BUILD)"
          sed -i '' -e "s/VERSION_PLACEHOLDER/${VERSION}/g" -e "s/BUILD_PLACEHOLDER/${BUILD}/g" project.yml
          if grep -q "VERSION_PLACEHOLDER\|BUILD_PLACEHOLDER" project.yml; then
            echo "::error::Version stamping failed, placeholders still present in project.yml"
            exit 1
          fi
          grep -n "MARKETING_VERSION\|CURRENT_PROJECT_VERSION" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS device
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Undirect.xcodeproj \
            -scheme Undirect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build log for debugging
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/logpush
          cd /tmp/logpush
          git init -q
          git config user.email "ci@undirect.local"
          git config user.name "Undirect CI"
          cp "$GITHUB_WORKSPACE/build.log" ./latest-build.log || echo "no log" > ./latest-build.log
          if [ -f "$GITHUB_WORKSPACE/diag.log" ]; then
            cat "$GITHUB_WORKSPACE/diag.log" ./latest-build.log > ./combined.log
            mv ./combined.log ./latest-build.log
          fi
          git checkout -q -b ci-logs
          git add latest-build.log
          git commit -q -m "ci log $GITHUB_RUN_ID"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package IPA (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Undirect.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X Undirect.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Undirect-ipa
          path: Undirect.ipa

      - name: Create the release (and its tag) with the IPA attached
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Undirect ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: Undirect.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
