name: Build Undirect IPA

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS device
        run: |
          set -euo pipefail
          xcodebuild \
            -project Undirect.xcodeproj \
            -scheme Undirect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Undirect.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X Undirect.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Undirect-ipa
          path: Undirect.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Undirect.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
