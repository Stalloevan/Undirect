name: Build Undirect IPA

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Diagnose Xcode environment
        run: |
          { ls /Applications | grep -i xcode || true
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list runtimes || true
          } 2>&1 | tee diag.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS device
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Undirect.xcodeproj \
            -scheme Undirect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build log for debugging
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/logpush
          cd /tmp/logpush
          git init -q
          git config user.email "ci@undirect.local"
          git config user.name "Undirect CI"
          cp "$GITHUB_WORKSPACE/build.log" ./latest-build.log || echo "no log" > ./latest-build.log
          if [ -f "$GITHUB_WORKSPACE/diag.log" ]; then
            cat "$GITHUB_WORKSPACE/diag.log" ./latest-build.log > ./combined.log
            mv ./combined.log ./latest-build.log
          fi
          git checkout -q -b ci-logs
          git add latest-build.log
          git commit -q -m "ci log $GITHUB_RUN_ID"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package IPA (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Undirect.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X Undirect.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Undirect-ipa
          path: Undirect.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Undirect.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
