name: Undirect
options:
  bundleIdPrefix: com.stalloevan
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
targets:
  Undirect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "*.h"
    dependencies:
      - framework: Frameworks/tor-nolzma.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - target: UndirectShare
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Undirect
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Downloads kept in Undirect show up in Files › On My iPhone › Undirect.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: "Undirect saves downloaded photos and videos to your library when a download rule says to."
        CFBundleURLTypes:
          - CFBundleURLName: com.stalloevan.undirect
            CFBundleURLSchemes:
              - undirect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.undirect
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Undirect-Bridging-Header.h
        DEAD_CODE_STRIPPING: "YES"
        MARKETING_VERSION: "VERSION_PLACEHOLDER"
        CURRENT_PROJECT_VERSION: "BUILD_PLACEHOLDER"
  UndirectShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Undirect
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Show up whenever *any* shared attachment is a web link or text —
            # the dictionary form hid Undirect whenever an app shared a link
            # together with something else (an image preview, a title, …).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              AND NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"))
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.undirect.share
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        MARKETING_VERSION: "VERSION_PLACEHOLDER"
        CURRENT_PROJECT_VERSION: "BUILD_PLACEHOLDER"
