name: Undirect
options:
  bundleIdPrefix: com.stalloevan
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
targets:
  Undirect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "*.h"
    dependencies:
      - framework: Frameworks/tor-nolzma.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - target: UndirectShare
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Undirect
        CFBundleShortVersionString: "3.12"
        CFBundleVersion: "27"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.stalloevan.undirect
            CFBundleURLSchemes:
              - undirect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.undirect
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Undirect-Bridging-Header.h
        DEAD_CODE_STRIPPING: "YES"
        MARKETING_VERSION: "3.12"
        CURRENT_PROJECT_VERSION: "27"
  UndirectShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Undirect
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.undirect.share
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        MARKETING_VERSION: "3.12"
        CURRENT_PROJECT_VERSION: "27"
