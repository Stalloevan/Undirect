name: Undirect
options:
  bundleIdPrefix: com.stalloevan
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
targets:
  Undirect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "*.h"
    dependencies:
      - framework: Frameworks/tor-nolzma.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libresolv.tbd
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Undirect
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "5"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.undirect
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Undirect-Bridging-Header.h
        DEAD_CODE_STRIPPING: "YES"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "5"
